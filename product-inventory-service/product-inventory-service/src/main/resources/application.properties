spring.application.name=product-inventory-service
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8083}
server.address=0.0.0.0
eureka.client.enabled=false
application.frontend-url=${FRONTEND_URL:http://localhost:3000}
services.auth-url=${AUTH_SERVICE_URL:http://localhost:8082}
services.order-url=${ORDER_SERVICE_URL:http://localhost:8081}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Keep the pool small by default for hosted low-resource databases.
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
# Temporary until versioned Flyway or Liquibase migrations are introduced.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Demo-only review data. Set to false to keep new databases free of sample reviews.
app.seed-demo-reviews=true
