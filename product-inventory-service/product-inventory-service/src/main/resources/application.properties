spring.application.name=product-inventory-service
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8083}
server.address=0.0.0.0
eureka.client.enabled=false
application.frontend-url=${FRONTEND_URL:http://localhost:3000}
services.auth-url=${AUTH_SERVICE_URL:http://localhost:8082}
services.order-url=${ORDER_SERVICE_URL:http://localhost:8081}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Demo-only review data. Set to false to keep new databases free of sample reviews.
app.seed-demo-reviews=true
