spring.application.name=auth-user-service
spring.config.import=optional:file:.env[.properties]
eureka.client.enabled=false

# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Keep the pool small by default for hosted low-resource databases.
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
# Temporary until versioned Flyway or Liquibase migrations are introduced.
spring.jpa.hibernate.ddl-auto=update

# Running on port 8082 to avoid port conflicts with other services
server.port=${PORT:8082}
server.address=0.0.0.0
application.frontend-url=${FRONTEND_URL:http://localhost:3000}

# JWT Configuration
# 256-bit secret key in hex format
application.security.jwt.secret-key=${JWT_SECRET}
# 1 day expiration for Access Token (86400000 ms)
application.security.jwt.expiration=86400000
# 7 days expiration for Refresh Token (604800000 ms)
application.security.jwt.refresh-token.expiration=604800000

# Spring Mail Properties (e.g. SMTP configurations)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${EMAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Debug Logging for Spring Security
logging.level.org.springframework.security=DEBUG
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
